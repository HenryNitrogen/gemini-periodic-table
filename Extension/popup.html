<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Periodic Table for Gemini</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      background: #12141a;
      color: #f3f4f6;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      color: #f9fafb;
    }

    .subtitle {
      font-size: 11.5px;
      color: #9ca3af;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .row-label {
      font-size: 12.5px;
      font-weight: 500;
      color: #e5e7eb;
    }

    .toggle {
      position: relative;
      width: 38px;
      height: 22px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #2e323d;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #f3f4f6;
      transition: transform 0.18s ease;
    }

    .toggle input:checked + .slider {
      background: #3b82f6;
    }

    .toggle input:checked + .slider::before {
      transform: translateX(16px);
    }

    .btn-primary {
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-primary:active {
      transform: scale(0.985);
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#818cf8"/>
        </linearGradient>
      </defs>
      <path d="M12 2C12.7 7.2 16.8 11.3 22 12C16.8 12.7 12.7 16.8 12 22C11.3 16.8 7.2 12.7 2 12C7.2 11.3 11.3 7.2 12 2Z" fill="url(#g)"/>
    </svg>
    <span class="title">Periodic Table for Gemini</span>
  </div>

  <p class="subtitle">
    118-element model selector UI replica: 3 released models (H, C, Ar), 115 Coming soon, and Thinking level controls.
  </p>

  <div class="row">
    <span class="row-label">Show on gemini.google.com</span>
    <label class="toggle">
      <input type="checkbox" id="toggleGemini" checked />
      <span class="slider"></span>
    </label>
  </div>

  <button type="button" class="btn-primary" id="openDemoBtn">Open Fullscreen Replica</button>

  <script src="popup.js"></script>
</body>
</html>
