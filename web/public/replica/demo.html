<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Periodic Table for Gemini</title>
  <link rel="stylesheet" href="periodic-table.css" />
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #06070a;
      color: #f3f4f6;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Centered deep-blue/indigo radial ambient glow matching the video */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 46% 42% at 50% 48%, rgba(30, 58, 138, 0.36) 0%, rgba(17, 24, 56, 0.22) 45%, rgba(6, 7, 10, 0) 75%);
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      padding: 32px 20px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-heading {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.025em;
      color: #f3f4f6;
      margin-bottom: 26px;
      text-align: center;
    }

    .prompt-anchor {
      position: relative;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Prompt Input Bar */
    .prompt-bar {
      width: 100%;
      height: 52px;
      border-radius: 999px;
      background: rgba(24, 26, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      padding: 0 12px 0 14px;
      gap: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .prompt-bar:focus-within {
      border-color: rgba(96, 165, 250, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(96, 165, 250, 0.15);
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #9ca3af;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f3f4f6;
    }

    .prompt-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #f3f4f6;
      font-size: 14.5px;
      font-family: inherit;
    }

    .prompt-input::placeholder {
      color: #7c8391;
    }

    .prompt-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* Popover mount anchored below the input bar */
    .popover-mount {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }

    /* Mode Switcher: Chat | Task */
    .mode-tabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 16px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: #8b92a1;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .mode-tab:hover {
      color: #d1d5db;
    }

    .mode-tab.is-active {
      background: rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
    }

    /* Starter Prompts */
    .starter-list {
      width: 100%;
      max-width: 520px;
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .starter-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #a6adbb;
      font-size: 13.5px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .starter-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #f3f4f6;
    }

    .starter-icon {
      width: 16px;
      height: 16px;
      color: #8b92a1;
      flex-shrink: 0;
    }

    /* Subtle Toast for prompt submission */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(24, 26, 32, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 200;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="stage">
    <h1 class="hero-heading">Where should we start?</h1>

    <div class="prompt-anchor">
      <form class="prompt-bar" id="promptForm">
        <button type="button" class="icon-btn" title="Add attachment" aria-label="Add attachment">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>

        <input
          type="text"
          class="prompt-input"
          id="promptInput"
          placeholder="Ask Gemini"
          autocomplete="off"
        />

        <div class="prompt-right">
          <div id="pillMount"></div>
          <button type="button" class="icon-btn" title="Use microphone" aria-label="Use microphone">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5 11C5 14.866 8.13401 18 12 18C15.866 18 19 14.866 19 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M12 18V21M9 21H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </form>

      <div class="popover-mount" id="popoverMount"></div>
    </div>

    <div class="mode-tabs" role="tablist" aria-label="Mode">
      <button type="button" class="mode-tab is-active" data-mode="Chat" role="tab" aria-selected="true">Chat</button>
      <button type="button" class="mode-tab" data-mode="Task" role="tab" aria-selected="false">Task</button>
    </div>

    <div class="starter-list">
      <button type="button" class="starter-item" data-prompt="What subject am I closest to mastering?">
        <svg class="starter-icon" viewBox="0 0 24 24" fill="none">
          <path d="M4 5.5C4 4.67157 4.67157 4 5.5 4H10.5C11.3284 4 12 4.67157 12 5.5V19.5C12 18.6716 11.3284 18 10.5 18H5.5C4.67157 18 4 18.6716 4 19.5V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M20 5.5C20 4.67157 19.3284 4 18.5 4H13.5C12.6716 4 12 4.67157 12 5.5V19.5C12 18.6716 12.6716 18 13.5 18H18.5C19.3284 18 20 18.6716 20 19.5V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span>What subject am I closest to mastering?</span>
      </button>

      <button type="button" class="starter-item" data-prompt="Test AI response speed">
        <svg class="starter-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 3C15.5 5.5 17 9.5 17 13.5L14 16.5H10L7 13.5C7 9.5 8.5 5.5 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="10" r="1.5" fill="currentColor"/>
          <path d="M10 16.5L8.5 20.5M14 16.5L15.5 20.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      <span>Test AI response speed</span>
      </button>

      <button type="button" class="starter-item" data-prompt="Reset my focus in 5 minutes">
        <svg class="starter-icon" viewBox="0 0 24 24" fill="none">
          <path d="M9 18H15M10 21H14M12 3C8.68629 3 6 5.68629 6 9C6 11.2208 7.2066 13.1599 9 14.1973V15.5C9 15.7761 9.22386 16 9.5 16H14.5C14.7761 16 15 15.7761 15 15.5V14.1973C16.7934 13.1599 18 11.2208 18 9C18 5.68629 15.3137 3 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Reset my focus in 5 minutes</span>
      </button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="elements-data.js"></script>
  <script src="periodic-table.js"></script>
  <script src="demo.js"></script>
</body>
</html>
